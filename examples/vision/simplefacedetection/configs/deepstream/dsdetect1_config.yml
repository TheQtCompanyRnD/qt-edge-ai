# Top-level DeepStream pipeline config for the simplefacedetection example.
# Only the streammux and primary-gie groups are parsed by the QtEdgeAi
# DeepStream backend; source and sink are provided by the Qt pipeline.

streammux:
  batch-size: 1
  batched-push-timeout: 40000
  width: 1920
  height: 1080

primary-gie:
  plugin-type: 0
  config-file-path: dsdetect1_pgie_config.yml
